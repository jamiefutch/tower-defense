<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Defense</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="game" aria-label="Tower defense playfield"></canvas>
        <div id="overlay" class="overlay" hidden>
          <div class="card">
            <h2 id="overlay-title"></h2>
            <div id="overlay-body"></div>
            <button id="overlay-btn" class="primary"></button>
          </div>
        </div>
      </div>

      <aside id="sidebar">
        <h1>Tower Defense</h1>

        <div class="stats">
          <div>Gold <b id="gold">0</b></div>
          <div>Lives <b id="lives">0</b></div>
          <div>Wave <b id="wave">0</b>/<span id="total">0</span></div>
        </div>
        <div id="phase" class="muted"></div>

        <button id="next-wave" class="primary"></button>

        <div class="row">
          <button id="pause">Pause</button>
          <button class="speed" data-speed="1">1x</button>
          <button class="speed" data-speed="2">2x</button>
          <button class="speed" data-speed="3">3x</button>
          <button id="mute" title="Toggle sound effects">Sound on</button>
        </div>

        <h2>Towers</h2>
        <div id="palette" class="palette"></div>

        <h2>Selected</h2>
        <div id="tower-panel"></div>

        <h2>Log</h2>
        <ul id="log"></ul>

        <div class="row map-row">
          <select id="map-select" aria-label="Map"></select>
          <button id="restart">New game</button>
        </div>

        <div class="row">
          <label class="muted" for="theme-select">Theme</label>
          <select id="theme-select"></select>
        </div>

        <p id="help" class="help"></p>
      </aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
